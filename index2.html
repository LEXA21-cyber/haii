<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ SURAT CINTA UNTUK KEYZA MUTIARA ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 30%, #1a0b2e, #0f0719);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow-x: hidden;
    cursor: pointer;
  }

  /* latar bintang berkilau */
  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8);}
    100% { opacity: 1; transform: scale(1.2);}
  }

  /* efek neon aura */
  .glow-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,80,120,0.15), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 500px;
    background: rgba(20, 10, 35, 0.65);
    backdrop-filter: blur(18px);
    border-radius: 60px 40px 70px 40px;
    padding: 2rem 1.8rem;
    box-shadow: 0 30px 45px rgba(0,0,0,0.4), 0 0 0 2px rgba(255, 200, 220, 0.2) inset, 0 0 20px rgba(255, 105, 180, 0.4);
    transition: all 0.4s ease;
    border: 1px solid rgba(255, 255, 255, 0.25);
    text-align: center;
    animation: floatUp 1s ease-out;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.96);}
    100% { opacity: 1; transform: translateY(0) scale(1);}
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #FFE6F0, #FFB3C6, #FF6F91);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    animation: gentleGlow 3s infinite alternate;
  }

  @keyframes gentleGlow {
    0% { filter: drop-shadow(0 0 2px #ff9fae);}
    100% { filter: drop-shadow(0 0 12px #ff4d7a);}
  }

  .message-card {
    background: rgba(0,0,0,0.35);
    border-radius: 48px;
    padding: 1.8rem 1rem;
    margin: 1.5rem 0;
    transition: all 0.2s;
    border-left: 4px solid #ff95b8;
    border-right: 4px solid #ff95b8;
    box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
  }

  #text {
    font-size: 1.45rem;
    font-weight: 500;
    line-height: 1.45;
    color: #FFF5F7;
    text-shadow: 0 1px 2px black;
    letter-spacing: 0.2px;
    transition: 0.2s;
    word-break: break-word;
  }

  /* tombol epic */
  .epic-btn {
    background: linear-gradient(95deg, #FF4D6D, #FF8CAA);
    border: none;
    padding: 14px 28px;
    border-radius: 60px;
    font-weight: bold;
    font-size: 1.1rem;
    font-family: 'Inter', sans-serif;
    color: #140B1F;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 8px #ffb3c6;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(4px);
    letter-spacing: 0.5px;
  }

  .epic-btn:hover {
    transform: scale(1.05) translateY(-3px);
    background: linear-gradient(95deg, #FF6B8A, #FFA0BE);
    box-shadow: 0 18px 28px rgba(0,0,0,0.4), 0 0 15px #ff99bb;
  }

  .epic-btn:active {
    transform: scale(0.98);
  }

  /* partikel hati super */
  .super-heart {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    font-size: 0px;
    animation: floatHeart 3s ease-out forwards;
    filter: drop-shadow(0 0 5px hotpink);
  }

  @keyframes floatHeart {
    0% {
      transform: translateY(0) scale(0.3);
      opacity: 1;
    }
    80% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(-180px) scale(1.4) rotate(15deg);
      opacity: 0;
    }
  }

  /* efek burst kembang api */
  .firework {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 300;
    animation: bang 1s ease-out forwards;
  }

  @keyframes bang {
    0% {
      transform: scale(0.2);
      opacity: 1;
    }
    100% {
      transform: scale(1.5);
      opacity: 0;
    }
  }

  /* hati jatuh romantis (gerakan lambat dgn style baru) */
  .falling-heart {
    position: fixed;
    top: -20px;
    pointer-events: none;
    z-index: 50;
    font-size: 20px;
    opacity: 0.7;
    animation: fallSlow 7s linear forwards;
  }

  @keyframes fallSlow {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.9;
    }
    80% {
      opacity: 0.7;
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }

  /* progress bar tersembunyi tapi lucu */
  .sentinel {
    margin-top: 20px;
    font-size: 0.7rem;
    opacity: 0.6;
    letter-spacing: 2px;
    font-weight: 300;
    background: rgba(0,0,0,0.3);
    display: inline-block;
    padding: 4px 14px;
    border-radius: 40px;
    backdrop-filter: blur(5px);
  }

  @media (max-width: 500px) {
    .container { padding: 1.5rem 1rem; }
    h1 { font-size: 1.7rem; }
    #text { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="glow-bg"></div>
<div class="stars" id="starsContainer"></div>

<div class="container">
  <h1>💌 SURAT DARI NDUUT 💌<br>✨ UNTUK MY INCESS CANCII ✨<br>🌸 KEYZA MUTIARA 🌸</h1>
  <div class="message-card">
    <p id="text">
      🌙 Hai my Imuppp Keyza Mutiara yang paling cancii...
    </p>
  </div>
  <button class="epic-btn" id="magicBtn">
    💖 Buka Suratnya 💖
  </button>
  <div class="sentinel" id="stepCounter">❥ 1 dari 9 pesan spesial buat kamu</div>
</div>

<script>
  // =========== SENARAI PESAN SPESIAL BUAT KEYZA MUTIARA (my incess cancii & imuppp) ===========
  const messages = [
    "🌙 Hai my Imuppp Keyza Mutiara yang paling cancii...",
    "💖 Aku, ndutt, mau bilang sesuatu dari hati ke kamu...",
    "🌸 Kamu tuh imuppp banget, tau nggak? Bikin aku selalu senyum-senyum sendiri.",
    "✨ My incess cancii, kamu tuh cahaya yang buat hariku berwarna.",
    "💪 Kadang kamu mungkin merasa lelah, tapi ingat: kamu kuat, kamu hebat, kamu luar biasa.",
    "🌈 Aku nggak akan pernah bosan bilang: Kamu istimewa banget buat aku.",
    "💌 Setiap pesan, setiap tawa kita, adalah kenangan paling manis.",
    "😊 Jadi tolong, jangan pernah ragu kalau kamu dicintai. Aku selalu ada buat my cancii.",
    "❤️ Sekali lagi dari ndutt: I love you more than words, my Imuppp Keyza Mutiara ❤️"
  ];
  const FINAL_MESSAGE = "✨✨ KEYZA MUTIARA, KAMU ADALAH ALASAN AKU TERSENYUM. TERIMA KASIH SUDAH MENJADI MY INCESS CANCII YANG IMUPPP ✨✨ — ndutt 💖";

  let currentIdx = 0;
  const textEl = document.getElementById("text");
  const stepCounter = document.getElementById("stepCounter");
  const btn = document.getElementById("magicBtn");

  // fungsi update pesan + efek spesial tiap klik
  function updateMessage() {
    if (currentIdx < messages.length) {
      textEl.innerText = messages[currentIdx];
      stepCounter.innerText = `💌 ${currentIdx+1} dari ${messages.length} • dari ndutt untuk cancii`;
      // efek getaran kecil di card biar hidup
      const card = document.querySelector(".message-card");
      card.style.transform = "scale(1.01)";
      setTimeout(() => { card.style.transform = "scale(1)"; }, 120);
    } 
    else if (currentIdx === messages.length) {
      // pesan final super spesial buat keyza
      textEl.innerText = FINAL_MESSAGE;
      stepCounter.innerText = "✨💖 TERBACA SEMUA 💖✨";
      // tambahan efek mewah: ledakan hati dan konfeti bunga api
      createFireworkExplosion();
      for(let i=0;i<22;i++) {
        setTimeout(() => createRisingHeart(), i*70);
      }
      // ubah tombol jadi 'Kamu Luar Biasa' & disable setelah final biar ga spam
      btn.innerHTML = "💖 I LOVE YOU, MY CANCII 💖";
      btn.style.background = "linear-gradient(95deg, #FFB347, #FF8C42)";
      btn.disabled = true;
      btn.style.cursor = "default";
      btn.style.opacity = "0.9";
      return;
    }
    currentIdx++;
  }

  // efek klik utama + animasi super
  function handleClick() {
    if (btn.disabled) return; // jika sudah final, tidak ada aksi tambahan
    // efek kilau tombol + hati kecil muncul dari tombol
    createSparksFromButton();
    // membuat partikel hati melambung tiap klik
    for (let i = 0; i < 8; i++) {
      setTimeout(() => createRisingHeart(), i * 45);
    }
    // efek suara getaran (simulasi sensasi, tanpa audio asli)
    vibrateLight();

    updateMessage();
    
    // jika pesan sudah mencapai final, kita kasih ekstra ledakan hati
    if (currentIdx === messages.length + 1) {
      createFireworkExplosion();
      for(let i=0;i<12;i++) setTimeout(()=> createRisingHeart(), i*60);
    }
  }

  // ========== EFek Super Cantik ==========
  // Hati terbang naik (rose)
  function createRisingHeart() {
    const heartDiv = document.createElement("div");
    heartDiv.classList.add("super-heart");
    heartDiv.innerHTML = ["❤️","💖","💗","💓","🌸","✨","⭐","💘","💝"][Math.floor(Math.random()*9)];
    heartDiv.style.left = Math.random() * 90 + 5 + "%";
    heartDiv.style.bottom = "10px";
    heartDiv.style.position = "fixed";
    heartDiv.style.fontSize = Math.random() * 24 + 18 + "px";
    heartDiv.style.animation = "floatHeart 2.8s ease-out forwards";
    document.body.appendChild(heartDiv);
    setTimeout(() => heartDiv.remove(), 2800);
  }

  // efek kilau tombol + hati kecil meledak
  function createSparksFromButton() {
    const rect = btn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    for (let i = 0; i < 14; i++) {
      const spark = document.createElement("div");
      spark.classList.add("firework");
      spark.style.backgroundColor = `hsl(${Math.random() * 40 + 320}, 100%, 65%)`;
      spark.style.left = centerX + (Math.random() - 0.5) * 45 + "px";
      spark.style.top = centerY + (Math.random() - 0.5) * 30 + "px";
      spark.style.width = "7px";
      spark.style.height = "7px";
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 800);
    }
  }

  // ledakan kembang api penuh warna di tengah
  function createFireworkExplosion() {
    for (let s = 0; s < 55; s++) {
      setTimeout(() => {
        const fire = document.createElement("div");
        fire.classList.add("firework");
        const colors = ["#FF4D6D", "#FFB347", "#FF69B4", "#C084FC", "#60A5FA", "#F472B6", "#FFA07A"];
        fire.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        fire.style.left = Math.random() * window.innerWidth + "px";
        fire.style.top = Math.random() * window.innerHeight * 0.7 + "px";
        fire.style.width = Math.random() * 12 + 6 + "px";
        fire.style.height = fire.style.width;
        document.body.appendChild(fire);
        setTimeout(() => fire.remove(), 900);
      }, s * 25);
    }
    // plus efek hati bertebaran
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const bigHeart = document.createElement("div");
        bigHeart.classList.add("super-heart");
        bigHeart.innerHTML = "❤️‍🔥";
        bigHeart.style.left = Math.random() * 100 + "%";
        bigHeart.style.bottom = "0px";
        bigHeart.style.fontSize = "34px";
        bigHeart.style.animation = "floatHeart 2.2s ease-out";
        document.body.appendChild(bigHeart);
        setTimeout(() => bigHeart.remove(), 2200);
      }, i * 60);
    }
  }

  // getar ringan (haptic vibe kalau support)
  function vibrateLight() {
    if (navigator.vibrate) navigator.vibrate(20);
  }

  // ========== Background Bintang Dinamis ==========
  function generateStars() {
    const starsContainer = document.getElementById("starsContainer");
    starsContainer.innerHTML = "";
    for (let i = 0; i < 160; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      const size = Math.random() * 3 + 1;
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = Math.random() * 5 + "s";
      star.style.animationDuration = Math.random() * 3 + 2 + "s";
      starsContainer.appendChild(star);
    }
  }

  // Hati jatuh romantis dengan gaya baru (gemulai)
  function startFallingHearts() {
    setInterval(() => {
      if (btn.disabled) {
        // setelah final, tambah lebih banyak hati jatuh untuk kesan ekstra
        for (let i=0;i<3;i++) createFallingHeart();
      } else {
        createFallingHeart();
      }
    }, 380);
  }

  function createFallingHeart() {
    const fallHeart = document.createElement("div");
    fallHeart.classList.add("falling-heart");
    const heartVariants = ["❤️", "💖", "💘", "💝", "🌸", "✨", "💓", "💗"];
    fallHeart.innerHTML = heartVariants[Math.floor(Math.random() * heartVariants.length)];
    fallHeart.style.left = Math.random() * 100 + "%";
    fallHeart.style.fontSize = Math.random() * 28 + 14 + "px";
    fallHeart.style.opacity = Math.random() * 0.7 + 0.3;
    fallHeart.style.animationDuration = Math.random() * 5 + 5 + "s";
    document.body.appendChild(fallHeart);
    setTimeout(() => fallHeart.remove(), 8000);
  }

  // event tombol
  btn.addEventListener("click", handleClick);

  // efek hover background sparkle ketika mouse bergerak (opsional berkesan)
  document.body.addEventListener("mousemove", (e) => {
    if (Math.random() > 0.96) {
      const glint = document.createElement("div");
      glint.style.position = "fixed";
      glint.style.left = e.clientX + "px";
      glint.style.top = e.clientY + "px";
      glint.style.width = "8px";
      glint.style.height = "8px";
      glint.style.background = "radial-gradient(circle, #ffb7c5, transparent)";
      glint.style.borderRadius = "50%";
      glint.style.pointerEvents = "none";
      glint.style.zIndex = "999";
      glint.style.opacity = "0.6";
      document.body.appendChild(glint);
      setTimeout(() => glint.remove(), 400);
    }
  });

  // animasi awal : sedikit efek hati di awal (first load)
  window.addEventListener("load", () => {
    generateStars();
    startFallingHearts();
    // buat beberapa hati kecil di awal biar welcoming
    for (let i = 0; i < 10; i++) {
      setTimeout(() => createRisingHeart(), i * 150);
    }
    // tambahan sentuhan manis: pesan awal sudah tersimpan di idx 0
    stepCounter.innerText = "💌 1 dari 9 pesan spesial buat kamu";
    textEl.innerText = messages[0];
    currentIdx = 1; // karena pesan pertama sudah ditampilkan di awal
  });

  // tambahan efek kilau teks dinamis (berkedip subtle)
  setInterval(() => {
    if (!btn.disabled) {
      const counter = document.querySelector(".sentinel");
      if(counter) counter.style.opacity = "0.9";
      setTimeout(() => { if(counter) counter.style.opacity = "0.6"; }, 500);
    }
  }, 1500);
</script>
</body>
</html>
